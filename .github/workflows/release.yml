name: Release

# Push a tag like v2.0.1 (matching the VERSION file) and this workflow runs the
# tests, builds the archive + SHA256SUMS and publishes a GitHub Release. The
# monitors in the field pick it up on their next update check.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Check tag matches VERSION
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION TAG=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION file ($VERSION)"
            exit 1
          fi
      - name: Test
        run: python -m pytest -q
      - name: Build archive
        run: python tools/build_release.py --out dist
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          python - <<'EOF'
          import re, pathlib, os
          ver = pathlib.Path("VERSION").read_text().strip()
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[?v?{re.escape(ver)}\]?.*?$\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else f"Release v{ver}")
          pathlib.Path("dist/NOTES.md").write_text(notes + "\n", encoding="utf-8")
          print(notes)
          EOF
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/NOTES.md \
            dist/w4boc-battery-monitor-*.zip dist/SHA256SUMS.txt
