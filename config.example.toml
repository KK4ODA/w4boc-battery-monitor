# W4BOC Battery Monitor — config.toml
# Edit here or on the dashboard's Settings page (which rewrites this file,
# keeping any keys it does not know). Secrets live in secrets.toml.
# Changes take effect after a monitor restart.

[site]
# Identity, sampling and data retention.
# Site name. Used in email subjects, APRS comments and the dashboard title.
name = "W4BOC"
# Time zone. IANA name, e.g. America/New_York.
timezone = "America/New_York"
# Database file. SQLite file, relative to the application folder.
db_path = "monitor.db"
# BMS poll interval (s). One Bluetooth connection per poll; be gentle on the BMS.
bms_sample_period_s = 60
# Charger sample interval (s). The charger broadcasts ~1 Hz; a sample is stored at least this often, sooner on significant change.
charger_sample_period_s = 60
# Keep raw samples (days). Full resolution for this many days.
retention_raw_days = 7
# Keep per-minute samples (days). Then one sample per minute until this age.
retention_minute_days = 30
# Keep hourly samples (days). Then one per hour; older samples are deleted.
retention_max_days = 365
# Instance lock port. Local TCP port used to make sure only one monitor runs.
instance_lock_port = 50001
# Start with Windows. Keep a Startup-folder shortcut to run.bat (created at startup if missing). The switch on the Settings page applies immediately.
start_with_windows = false

[bms]
# JBD/Xiaoxiang BMS inside the LiFePO4 pack (find the MAC with tools/scan.py).
# BMS Bluetooth MAC.
mac = "AA:BB:CC:DD:EE:FF"
# BMS name. Informational.
name = "DP04S007L4S200A"

[victron]
# Victron Blue Smart IP22. The encryption key comes from VictronConnect → Product Info → Encryption data.
# Charger Bluetooth MAC.
mac = "AA:BB:CC:DD:EE:00"
# encryption_key lives in secrets.toml

[email]
# Gmail SMTP with an app password. Leave the password blank to disable email.
# Sender (Gmail address).
sender = "you@gmail.com"
# Recipients. One address per line.
recipients = [
  "operator1@example.com",
  "operator2@example.com",
]
# SMTP server.
smtp_host = "smtp.gmail.com"
# SMTP port. 587 = STARTTLS.
smtp_port = 587
# app_password lives in secrets.toml

[aprs]
# RF via soundmodem's AGWPE server and optional APRS-IS uplink. Header/telemetry formats are fixed; only cadence and identity are settings.
# APRS enabled.
enabled = true
# Callsign-SSID.
callsign = "W4BOC-1"
# AGWPE host. soundmodem's AGWPE TCP server (we bypass YAAC, which refused to RF-route our packets).
agw_host = "localhost"
# AGWPE port.
agw_port = 8000
# APRS-IS server.
aprsis_host = "rotate.aprs2.net"
# APRS-IS port.
aprsis_port = 14580
# APRS-IS passcode. 0 disables the Internet uplink (fully offline operation). Standard passcode generators apply.
aprsis_passcode = 0
# Digipeat path. Comma-separated, appended to RF frames only.
path = "WIDE1-1,WIDE2-1"
# Latitude. Decimal degrees, north positive.
lat = 33.80552
# Longitude. Decimal degrees, east positive.
lon = -84.1465
# Symbol table. One character ('/', '\' or an overlay letter).
symbol_table = "I"
# Symbol code. One character ('#' = digipeater).
symbol_code = "#"
# Destination (tocall). APZ = experimental. Changing this changes every packet — leave it.
tocall = "APZBAT"
# Telemetry project name. Sent in the BITS header. Blank = '<site name> Battery'.
project_name = ""
# Position comment prefix. Blank = '<site name> batt'. The comment becomes e.g. 'W4BOC batt 13.78V 100% 23C'.
comment_prefix = ""
# Telemetry data every (min). T#NNN frames.
data_interval_min = 10
# Telemetry headers every (min). PARM/UNIT/EQNS/BITS set.
headers_interval_min = 60
# Position every (min).
position_interval_min = 15
# Send position packets. Off when sharing the callsign with a YAAC beacon that already sends it.
send_position = true

[mains]
# How an AC outage is recognised (see the Power page for the full explanation).
# Charger silent (min) → suspect outage. While the BMS still answers. One Bluetooth restart follows; still silent this long after it → MAINS LOST.
fast_minutes = 5
# BMS 'still answering' window (min).
ble_alive_minutes = 3
# Charger silent (min) → outage even if BMS silent. Low-confidence fallback (may be a Bluetooth failure).
slow_minutes = 45
# Charger heard within (min) → mains ON.
restore_minutes = 2
# Report 'discharging' below (A). Informational text in alerts only.
discharge_current_a = -1.0
# Use Windows power status. Instant detection if the PC is on a USB-connected UPS.
use_windows_power_status = true
# APRS status packet on change. '>AC MAINS LOST …' / '>AC MAINS RESTORED …'.
aprs_status_packet = true
# Immediate APRS position + telemetry on change.
aprs_kick_telemetry = true
# Append ' MAINS LOST' to the APRS comment. While the outage lasts.
aprs_comment_flag = true

[alerts]
# When to email and when to enter DEGRADED mode.
# SoC urgent below (%).
soc_urgent_pct = 30
# SoC DEGRADED below (%). Enters DEGRADED mode (daily digest).
soc_degraded_pct = 50
# SoC recovered above (%). Needed (with mains OK) to leave DEGRADED.
soc_recovery_pct = 80
# SoC drop per hour → urgent (%).
soc_drop_per_hour_pct = 20
# Cell spread event above (mV). Logged, no email.
cell_spread_mv = 30
# Battery temperature high (°C).
temp_high_c = 35
# Battery temperature low (°C).
temp_low_c = 0
# BLE restarts per 24 h before emailing.
watchdog_email_threshold = 12
# Daily digest hour (local). Only while DEGRADED.
digest_hour = 8
# Daily digest minute.
digest_minute = 0
# One urgent email per trigger per (min).
urgent_rate_limit_minutes = 60
# Condition clear for (min) before NORMAL. Hysteresis.
mode_recovery_minutes = 60

[dashboard]
# Web dashboard binding and what happens when the monitor starts.
# Bind address. 127.0.0.1 = this PC only (expose with Tailscale serve).
host = "127.0.0.1"
# Port.
port = 8080
# Open the dashboard in a browser at startup. Only if no browser tab already has it open.
open_browser = true
# Wait for an existing tab (s).
browser_check_delay_s = 15

[updater]
# Automatic updates from GitHub Releases.
# Automatic update checks.
enabled = true
# GitHub repository. owner/name publishing the releases.
repo = "KK4ODA/w4boc-battery-monitor"
# Check every (hours).
check_interval_hours = 6
# First check after start (min).
startup_check_delay_min = 3
# Install automatically. Otherwise wait for the Install button.
auto_install = true
# github_token lives in secrets.toml
